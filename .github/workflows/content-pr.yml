# Content editor branches (proposed D-069 and D-071; docs/CONTENT-GUIDE.md): every save in the content editor
# (/keystatic) is a commit on a content/… branch. This opens one change request (pull request) per branch, so the owner
# can review the preview and the checks (ci.yml runs on the push) before anything is published. It never merges.
name: Content change request

on:
  push:
    branches: ["content/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: content-pr-${{ github.ref }}

jobs:
  open:
    name: Open a change request for this content branch
    runs-on: ubuntu-latest
    steps:
      - name: Open or find the change request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Change request #$existing is already open for $BRANCH; this save updates it."
            exit 0
          fi
          # Creating a branch in the editor pushes it before anything is saved on it: nothing to propose yet.
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$BRANCH has no saves yet; its change request opens with the first save."
            exit 0
          fi
          body=$(printf '%s\n' \
            "A content change saved in the content editor, on the branch \`$BRANCH\`." \
            "" \
            "**What happens next**" \
            "- **Checks** run on every save, in about 5 minutes: brand language, scope of practice, content rules, accessibility, phones and links. They show at the foot of this page." \
            "- **Preview:** Vercel's preview link appears below once it builds." \
            "- **The owner's own change** (every save on this branch made by the owner in the editor, content files only): once the checks pass, the content fast lane merges it, puts it live and comments **Live** here, usually within 10 minutes of the save. **Please don't merge it yourself:** a merge doesn't publish anything, and it stops the fast lane." \
            "- **Anyone else's change:** the fast lane comments to say why it needs the owner's approval. Once the owner approves, Claude merges it and the owner promotes the release." \
            "" \
            "Step by step: the Website content guide (docs/CONTENT-GUIDE.md), under \"Edit the website\".")
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "Content: ${BRANCH#content/}" --body "$body"
