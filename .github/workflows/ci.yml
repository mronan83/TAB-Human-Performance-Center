name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, RLS, contrast, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Row-level security tests (in-process Postgres)
        run: npm run test:rls

      - name: Design-token contrast (WCAG 2.2 AA)
        run: npm run test:contrast

      - name: Production build
        run: npm run build

      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
