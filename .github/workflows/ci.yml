name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, RLS, contrast, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Row-level security tests (in-process Postgres)
        run: npm run test:rls

      - name: Design-token contrast (WCAG 2.2 AA)
        run: npm run test:contrast

      # Retired names, the old philosophy and wrong pillar counts (owner, 2026-10-05: no misaligned verbiage)
      - name: Brand consistency
        run: npm run test:brand

      # Traceability, architecture and data model pages in step with the code (CLAUDE.md "Living documents")
      - name: Living documents
        run: npm run docs:check

      - name: Production build
        run: npm run build

      # S19 §19.15 smoke tests, redirect map, link crawl, SEO and WCAG 2.2 AA scans against the build (NFR-007/008)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end launch checks
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
