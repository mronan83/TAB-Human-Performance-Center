# Dependency patching routine (ARCHITECTURE §7, R-005). Grouped weekly PRs; security updates arrive as needed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (Next 16, React, zod 4, TypeScript 7, ...) are planned upgrades with their own PR and
      # testing, not routine updates; they're tracked in docs/requirements-register.md (UPG items).
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
